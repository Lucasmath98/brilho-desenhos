name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bun.lock fixa as mesmas versões usadas no Lovable (npm install puxava versões diferentes)
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          GITHUB_PAGES: "true"
      - name: Prepare Pages folder
        run: |
          IDX=$(find dist .output -name index.html -not -path "*/server/*" 2>/dev/null | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$IDX" ]; then echo "index.html não gerado"; find dist .output -maxdepth 3 2>/dev/null; exit 1; fi
          OUT=$(dirname "$IDX"); echo "Publicando $OUT"
          rm -rf pages && cp -r "$OUT" pages
          cp dist/sw.js dist/workbox-*.js pages/ 2>/dev/null || true
          cp pages/index.html pages/404.html
          touch pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
